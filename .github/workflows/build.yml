name: Build

# Builds the mod and runs the headless game tests on every push and pull request.
# Pushing a tag like v0.1.0 also creates a GitHub release with the jar attached.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: gradle/actions/wrapper-validation@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v4

      - name: Build and test
        run: ./gradlew build

      - uses: actions/upload-artifact@v4
        with:
          name: wireless-redstone
          path: build/libs/*.jar

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      # The tag (v0.1.0) must match mod_version; the release notes are that version's
      # section of CHANGELOG.md.
      - name: Check the version and extract release notes
        id: notes
        run: |
          version="${GITHUB_REF_NAME#v}"
          declared="$(grep '^mod_version=' gradle.properties | cut -d= -f2 | tr -d '\r')"
          if [ "$declared" != "$version" ]; then
            echo "::error::Tag says ${version} but gradle.properties has mod_version=${declared}"; exit 1
          fi
          awk -v v="$version" '
            index($0, "## [" v "]") == 1 { found = 1; next }
            /^## \[/ { found = 0 }
            found && !/^\[[^]]+\]: / { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "::error::No '## [${version}]' section in CHANGELOG.md"; exit 1
          fi
          echo "title=Wireless Redstone ${version}" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v4
        with:
          name: wireless-redstone
          path: dist

      - uses: softprops/action-gh-release@v2
        with:
          name: ${{ steps.notes.outputs.title }}
          body_path: release-notes.md
          files: dist/*.jar
